const S="akt_s", DAYS=30;
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function openWith(user, raw){
  const K=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(P.iv)},K,ub(P.ct));
  const html=new TextDecoder().decode(pt).replaceAll("__USER__",esc(user));
  document.open(); document.write(html); document.close();
}
async function unwrap(user, pass){
  const r=P.u[user]; if(!r) throw 0;
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const w=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(r.s),iterations:P.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(r.i)},w,ub(r.k)));
}
(async()=>{
  try{
    const s=JSON.parse(localStorage.getItem(S)||"null");
    if(s && s.exp>Date.now() && P.u[s.u]){ await openWith(s.u, ub(s.k)); return; }
    localStorage.removeItem(S);
  }catch(e){ try{localStorage.removeItem(S)}catch(_){} }
  const f=document.getElementById("f"); f.hidden=false;
  f.addEventListener("submit",async e=>{
    e.preventDefault();
    const u=document.getElementById("u").value.trim().toLowerCase(), p=document.getElementById("p").value;
    const b=document.getElementById("b"), err=document.getElementById("err");
    b.disabled=true; b.textContent="Kontrol ediliyor…"; err.textContent="";
    try{
      const raw=await unwrap(u,p);
      if(document.getElementById("rem").checked){ try{ localStorage.setItem(S,JSON.stringify({u,k:b64(raw),exp:Date.now()+DAYS*864e5})); }catch(_){} }
      await openWith(u,raw);
    }catch(_){ err.textContent="Kullanıcı adı veya şifre yanlış."; b.disabled=false; b.textContent="Giriş yap"; }
  });
})();
